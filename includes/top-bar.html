<!-- DATELINE BAR -->
<div class="bg-bar border-bar-border border-b">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-2 sm:px-6 lg:px-8">
    <div class="flex items-center gap-4">
      <time data-current-date datetime="" class="text-bar-text font-mono text-[0.6875rem]">Updated daily</time>
      <span class="text-bar-text-muted font-mono text-[0.6875rem] max-sm:hidden">Independent OpenClaw reporting, releases, guides, and community coverage</span>
    </div>
    <div class="flex items-center gap-6">
      <a href="/feed.xml" class="hover:text-bar-text text-bar-text-muted font-sans text-[0.6875rem] font-medium">RSS</a>
      <a href="/about/" class="hover:text-bar-text text-bar-text-muted font-sans text-[0.6875rem] font-medium">About</a>
    </div>
  </div>
</div>

<!-- TOP VIBRANT RED BAR -->
<div class="bg-red-accent">
  <div class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-1.5 sm:px-6 lg:px-8">
    <div class="flex shrink-0 items-center gap-2">
      <span class="relative flex size-2">
        <span class="absolute inline-flex size-full animate-ping rounded-full bg-white opacity-75"></span>
        <span class="relative inline-flex size-2 rounded-full bg-white"></span>
      </span>
      <span class="font-mono text-[0.625rem] font-semibold tracking-wider text-white uppercase">Latest</span>
    </div>
    <div class="relative min-w-0 flex-1 overflow-hidden" aria-label="Latest OpenClaw stories ticker">
      <div class="pointer-events-none absolute inset-y-0 left-0 z-10 w-[100px]" style="background: linear-gradient(to right, #e20c00, transparent);"></div>
      <div class="pointer-events-none absolute inset-y-0 right-0 z-10 w-[100px]" style="background: linear-gradient(to left, #e20c00, transparent);"></div>
      <div class="ticker-animate flex w-max gap-12" role="list" aria-label="Latest OpenClaw stories">
        <div class="flex items-center gap-12" role="listitem">
          <ForEach content="posts" as="post" orderBy="date, desc" count="6">
            <a href="{post.link}" class="flex items-center justify-center font-sans text-[0.75rem] whitespace-nowrap text-white/90 hover:text-white">{post.title}</a>
            <span class="whitespace-nowrap text-white/50" aria-hidden="true">&triangleright;</span>
          </ForEach>
        </div>
        <div class="flex items-center gap-12" aria-hidden="true">
          <ForEach content="posts" as="post" orderBy="date, desc" count="6">
            <a href="{post.link}" tabindex="-1" class="flex items-center justify-center font-sans text-[0.75rem] whitespace-nowrap text-white/90 hover:text-white">{post.title}</a>
            <span class="whitespace-nowrap text-white/50">&triangleright;</span>
          </ForEach>
        </div>
      </div>
    </div>
  </div>
</div>
