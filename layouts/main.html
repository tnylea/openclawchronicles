<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
    <meta name="description" content="{frontmatter.excerpt}" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="googlebot" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="{frontmatter.url}" />
    <link rel="alternate" hreflang="en" href="{frontmatter.url}" />
    <link rel="alternate" hreflang="x-default" href="{frontmatter.url}" />
    <meta name="author" content="{frontmatter.authorName}" />
    <!-- Open Graph -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{frontmatter.title}" />
    <meta property="og:description" content="{frontmatter.excerpt}" />
    <meta property="og:url" content="{frontmatter.url}" />
    <meta property="og:image" content="https://openclawchronicles.com{frontmatter.ogImageUrl}" />
    <meta property="og:image:secure_url" content="https://openclawchronicles.com{frontmatter.ogImageUrl}" />
    <meta property="og:image:alt" content="Cover image for {frontmatter.title}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="OpenClaw Chronicles" />
    <meta property="og:locale" content="en_US" />
    <meta property="article:published_time" content="{frontmatter.date}" />
    <meta property="article:modified_time" content="{frontmatter.dateModified}" />
    <meta property="article:author" content="{frontmatter.authorName}" />
    <meta property="article:section" content="OpenClaw News" />
    <meta property="og:updated_time" content="{frontmatter.dateModified}" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{frontmatter.title}" />
    <meta name="twitter:description" content="{frontmatter.excerpt}" />
    <meta name="twitter:image" content="https://openclawchronicles.com{frontmatter.ogImageUrl}" />
    <meta name="twitter:image:alt" content="Cover image for {frontmatter.title}" />
    <meta name="twitter:site" content="@openclawai" />
    <meta name="twitter:creator" content="@openclawai" />
    <!-- JSON-LD Article Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "{frontmatter.title}",
      "description": "{frontmatter.excerpt}",
      "image": {
        "@type": "ImageObject",
        "url": "https://openclawchronicles.com{frontmatter.ogImageUrl}",
        "width": 1200,
        "height": 630
      },
      "url": "{frontmatter.url}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{frontmatter.url}"
      },
      "articleSection": "OpenClaw News",
      "keywords": ["OpenClaw", "OpenClaw news", "OpenClaw releases", "OpenClaw security", "OpenClaw guides"],
      "inLanguage": "en",
      "author": {
        "@type": "Person",
        "name": "{frontmatter.authorName}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "OpenClaw Chronicles",
        "url": "https://openclawchronicles.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://openclawchronicles.com/icon-512.png",
          "width": 512,
          "height": 512
        }
      },
      "datePublished": "{frontmatter.date}",
      "dateModified": "{frontmatter.dateModified}",
      "isAccessibleForFree": true
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OpenClaw Chronicles",
      "url": "https://openclawchronicles.com",
      "description": "OpenClaw releases, security coverage, guides, migrations, and ecosystem reporting.",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://openclawchronicles.com/posts/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "OpenClaw Chronicles",
      "url": "https://openclawchronicles.com",
      "logo": "https://openclawchronicles.com/icon-512.png",
      "sameAs": [
        "https://x.com/openclawai",
        "https://github.com/tnylea/openclawchronicles"
      ],
      "publishingPrinciples": "https://openclawchronicles.com/about/#editorial-standards",
      "ethicsPolicy": "https://openclawchronicles.com/about/#editorial-standards",
      "correctionsPolicy": "https://openclawchronicles.com/about/#corrections-policy"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SiteNavigationElement",
      "name": ["Home", "Posts", "Releases", "Security", "Guides", "Migrations", "Memory", "Local Models", "Site Map", "About", "RSS Feed"],
      "url": [
        "https://openclawchronicles.com/",
        "https://openclawchronicles.com/posts/",
        "https://openclawchronicles.com/releases/",
        "https://openclawchronicles.com/security/",
        "https://openclawchronicles.com/guides/",
        "https://openclawchronicles.com/migrations/",
        "https://openclawchronicles.com/memory/",
        "https://openclawchronicles.com/local-models/",
        "https://openclawchronicles.com/site-map/",
        "https://openclawchronicles.com/about/",
        "https://openclawchronicles.com/feed.xml"
      ]
    }
    </script>
    <!-- Breadcrumb Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://openclawchronicles.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Posts",
          "item": "https://openclawchronicles.com/posts/"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{frontmatter.title}",
          "item": "{frontmatter.url}"
        }
      ]
    }
    </script>
    <!-- Google Analytics -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      window.__loadAnalytics = function () {
        if (window.__analyticsLoaded) return;
        if (navigator.connection && navigator.connection.saveData) return;
        window.__analyticsLoaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7016K8GHP7';
        document.head.appendChild(script);
        gtag('js', new Date());
        gtag('config', 'G-7016K8GHP7', { transport_type: 'beacon' });
      };

      (function () {
        var triggered = false;
        var interactionEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];

        function onReady() {
          if (triggered) return;
          if (document.visibilityState === 'hidden') return;
          triggered = true;
          interactionEvents.forEach(function (eventName) {
            window.removeEventListener(eventName, onReady, listenerOptions);
          });
          document.removeEventListener('visibilitychange', onReady);
          if ('requestIdleCallback' in window) {
            requestIdleCallback(window.__loadAnalytics, { timeout: 2000 });
          } else {
            setTimeout(window.__loadAnalytics, 1200);
          }
        }

        var listenerOptions = { once: true, passive: true };
        interactionEvents.forEach(function (eventName) {
          window.addEventListener(eventName, onReady, listenerOptions);
        });
        document.addEventListener('visibilitychange', onReady, { passive: true });
        window.addEventListener('load', function () {
          setTimeout(onReady, 5000);
        }, { once: true });
      })();
    </script>
    <link rel="alternate" type="application/rss+xml" title="OpenClaw Chronicles RSS" href="https://openclawchronicles.com/feed.xml" />
    <link rel="alternate" type="application/feed+json" title="OpenClaw Chronicles JSON Feed" href="https://openclawchronicles.com/feed.json" />
    <link rel="search" type="application/opensearchdescription+xml" title="OpenClaw Chronicles Search" href="https://openclawchronicles.com/opensearch.xml" />
    <link rel="sitemap" type="application/xml" title="OpenClaw Chronicles Sitemap" href="https://openclawchronicles.com/sitemap-index.xml" />
    <link rel="me" href="https://x.com/openclawai" />
    <link rel="me" href="https://github.com/tnylea/openclawchronicles" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      (function () {
        var fontHref = 'https://fonts.googleapis.com/css2?family=Manufacturing+Consent&text=OpenClawChronicles&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,wght@0,400;1,400&family=Playfair+Display:wght@600&display=optional';
        if (navigator.connection && navigator.connection.saveData) return;
        function ensureFontConnections() {
          if (!document.querySelector('link[data-font-preconnect="google-fonts"]')) {
            var preconnect = document.createElement('link');
            preconnect.rel = 'preconnect';
            preconnect.href = 'https://fonts.googleapis.com';
            preconnect.dataset.fontPreconnect = 'google-fonts';
            document.head.appendChild(preconnect);
          }
          if (!document.querySelector('link[data-font-preconnect="google-fonts-static"]')) {
            var staticPreconnect = document.createElement('link');
            staticPreconnect.rel = 'preconnect';
            staticPreconnect.href = 'https://fonts.gstatic.com';
            staticPreconnect.crossOrigin = 'anonymous';
            staticPreconnect.dataset.fontPreconnect = 'google-fonts-static';
            document.head.appendChild(staticPreconnect);
          }
        }
        function loadFonts() {
          if (document.querySelector('link[data-fonts="site-fonts"]')) return;
          ensureFontConnections();
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = fontHref;
          link.media = 'print';
          link.dataset.fonts = 'site-fonts';
          link.onload = function () { link.media = 'all'; };
          document.head.appendChild(link);
        }
        var fontTriggerEvents = ['pointerdown', 'keydown', 'touchstart'];
        var listenerOptions = { once: true, passive: true };
        fontTriggerEvents.forEach(function (eventName) {
          window.addEventListener(eventName, loadFonts, listenerOptions);
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadFonts, { timeout: 1500 });
        } else {
          window.addEventListener('load', function () { setTimeout(loadFonts, 300); }, { once: true });
        }
      })();
    </script>
    <noscript>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&text=OpenClawChronicles&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,wght@0,400;1,400&family=Playfair+Display:wght@600&display=optional"
        rel="stylesheet" />
    </noscript>
    <link rel="preload" href="/styles.css" as="style" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme") || "system";
        if (
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }

        var mainScriptLoaded = false;
        function loadMainScript() {
          if (mainScriptLoaded) return;
          mainScriptLoaded = true;
          var script = document.createElement("script");
          script.src = "/assets/js/main.js";
          script.defer = true;
          document.head.appendChild(script);
        }

        var triggerEvents = ["pointerdown", "keydown", "touchstart", "focusin"];
        var listenerOptions = { once: true, passive: true };
        triggerEvents.forEach(function (eventName) {
          window.addEventListener(eventName, loadMainScript, listenerOptions);
        });

        window.addEventListener("load", function () {
          if (navigator.connection && navigator.connection.saveData) return;
          if ("requestIdleCallback" in window) {
            requestIdleCallback(loadMainScript, { timeout: 1800 });
          } else {
            setTimeout(loadMainScript, 1200);
          }
        }, { once: true });
      })();
    </script>
  </head>
  <body class="bg-surface font-body text-ink antialiased">
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="isolate">
      {slot}
      <include src="footer.html"></include>
    </div>
  </body>
</html>
