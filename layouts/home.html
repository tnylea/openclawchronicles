<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
    <meta name="description" content="The #1 source for OpenClaw news, releases, tutorials, and community updates." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="author" content="Cody" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://openclawchronicles.com/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{title}" />
    <meta property="og:description" content="The #1 source for OpenClaw news, releases, tutorials, and community updates." />
    <meta property="og:url" content="https://openclawchronicles.com/" />
    <meta property="og:image" content="https://openclawchronicles.com/assets/images/about-banner.jpg" />
    <meta property="og:image:secure_url" content="https://openclawchronicles.com/assets/images/about-banner.jpg" />
    <meta property="og:image:alt" content="OpenClaw Chronicles homepage cover" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="OpenClaw Chronicles" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{title}" />
    <meta name="twitter:description" content="The #1 source for OpenClaw news, releases, tutorials, and community updates." />
    <meta name="twitter:image" content="https://openclawchronicles.com/assets/images/about-banner.jpg" />
    <meta name="twitter:image:alt" content="OpenClaw Chronicles homepage cover" />
    <meta name="twitter:site" content="@openclawchronicles" />
    <meta name="twitter:creator" content="@openclawchronicles" />
    <!-- JSON-LD WebSite Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OpenClaw Chronicles",
      "url": "https://openclawchronicles.com",
      "description": "The #1 source for OpenClaw news, releases, tutorials, and community updates.",
      "inLanguage": "en",
      "keywords": ["OpenClaw news", "OpenClaw releases", "OpenClaw security", "OpenClaw guides"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://openclawchronicles.com/posts/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "OpenClaw Chronicles",
        "url": "https://openclawchronicles.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://openclawchronicles.com/icon-512.png",
          "width": 512,
          "height": 512
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "OpenClaw Chronicles homepage",
      "url": "https://openclawchronicles.com/",
      "description": "OpenClaw news, release coverage, security explainers, and practical setup guides.",
      "isPartOf": {
        "@type": "WebSite",
        "name": "OpenClaw Chronicles",
        "url": "https://openclawchronicles.com"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenClaw Chronicles",
      "url": "https://openclawchronicles.com",
      "logo": "https://openclawchronicles.com/icon-512.png",
      "sameAs": [
        "https://x.com/openclawai",
        "https://github.com/tnylea/openclawchronicles"
      ]
    }
    </script>
    <!-- Google Analytics -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      window.__loadAnalytics = function () {
        if (window.__analyticsLoaded) return;
        window.__analyticsLoaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7016K8GHP7';
        document.head.appendChild(script);
        gtag('js', new Date());
        gtag('config', 'G-7016K8GHP7');
      };

      if ('requestIdleCallback' in window) {
        requestIdleCallback(window.__loadAnalytics, { timeout: 3000 });
      } else {
        window.addEventListener('load', window.__loadAnalytics, { once: true });
      }
    </script>
    <link rel="alternate" type="application/rss+xml" title="OpenClaw Chronicles RSS" href="https://openclawchronicles.com/feed.xml" />
    <link rel="alternate" type="application/feed+json" title="OpenClaw Chronicles JSON Feed" href="https://openclawchronicles.com/feed.json" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&text=OpenClawChronicles&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'" />

      <link
        href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&text=OpenClawChronicles&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    </noscript>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/assets/js/main.js" defer></script>
    <script>
      (function () {
        var t = localStorage.getItem("theme") || "system";
        if (
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-surface font-body text-ink antialiased">
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="isolate">
      {slot}
      <include src="footer.html"></include>
    </div>
  </body>
</html>
